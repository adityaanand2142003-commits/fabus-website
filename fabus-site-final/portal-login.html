<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | FABUS Global Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#241F18; --sand:#F5F7F7; --orange:#F68C36; }
  *{box-sizing:border-box;}
  body{margin:0; background:#000; color:#fff; font-family:'Manrope',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;}
  .portal-bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(rgba(246,140,54,0.06) 1px, transparent 1px);
    background-size:26px 26px;
  }
  .portal-card{
    position:relative; z-index:1; width:100%; max-width:420px;
    background:#0d0b09; border:1px solid rgba(246,140,54,0.3);
    border-radius:18px; padding:2.75rem 2.5rem; box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  .portal-dismiss{
    position:absolute; top:1.1rem; right:1.1rem; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15);
    border-radius:50%; color:#B8B0A2; font-size:1.1rem; line-height:1; cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .portal-dismiss:hover{ background:rgba(255,255,255,0.08); color:#fff; border-color:rgba(255,255,255,0.3); }
  .portal-lockup{ margin-bottom:2.1rem; }
  .portal-wordmark{
    display:flex; align-items:center; gap:.45rem; margin:0 0 1.15rem;
  }
  .portal-wordmark b,
  .portal-wordmark span{
    font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:.72rem;
    letter-spacing:.18em; line-height:1; color:var(--orange);
  }
  .portal-wordmark i{
    flex:1; height:1px; margin-left:.35rem;
    background:linear-gradient(90deg, rgba(246,140,54,.55), transparent);
  }
  .portal-heading{
    font-family:'Playfair Display',serif; font-weight:400; font-size:1.85rem;
    line-height:1.25; color:#fff; margin:0; max-width:20ch;
  }
  .portal-sub{
    font-size:.85rem; line-height:1.6; color:#B8B0A2; text-align:center; margin:0 0 2rem;
  }
  .portal-field{ display:flex; flex-direction:column; gap:.45rem; margin-bottom:1.3rem; }
  .portal-label{
    font-family:'Outfit',sans-serif; font-weight:500; font-size:.7rem; letter-spacing:.08em;
    text-transform:uppercase; color:#B8B0A2;
  }
  .portal-input{
    font-family:'Manrope',sans-serif; font-size:.92rem; color:#fff;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.15);
    border-radius:10px; padding:.85rem 1rem; outline:none;
    transition:border-color .25s ease, background .25s ease;
  }
  .portal-input::placeholder{ color:#6b6459; }
  .portal-input:focus{ border-color:var(--orange); background:rgba(255,255,255,0.06); }
  .portal-row-between{ display:flex; justify-content:space-between; align-items:center; margin:-.3rem 0 1.6rem; }
  .portal-remember{ display:flex; align-items:center; gap:.5rem; font-size:.8rem; color:#B8B0A2; }
  .portal-remember input{ accent-color:var(--orange); }
  .portal-forgot{ font-size:.8rem; color:var(--orange); text-decoration:none; }
  .portal-forgot:hover{ text-decoration:underline; }
  .portal-submit{
    width:100%; padding:1rem; background:var(--orange); color:#000; border:none;
    border-radius:999px; font-family:'Outfit',sans-serif; font-weight:600;
    font-size:.82rem; letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
    transition:background .3s ease, transform .25s ease;
  }
  .portal-submit:hover{ background:#ffa456; transform:translateY(-2px); }
  .portal-error{
    display:none; background:rgba(214,69,69,0.12); border:1px solid rgba(214,69,69,0.4);
    color:#f0a0a0; font-size:.82rem; padding:.75rem 1rem; border-radius:10px; margin-bottom:1.3rem;
  }
  .portal-error a{ color:#fff; text-decoration:underline; }
  .portal-error a:hover{ color:var(--orange); }
  .portal-footer-note{
    text-align:center; font-size:.8rem; color:#6b6459; margin-top:1.75rem;
    padding-top:1.5rem; border-top:1px solid rgba(255,255,255,0.08);
  }
  .portal-footer-note a{ color:var(--orange); text-decoration:none; }
  .portal-footer-note a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="portal-bg-grid"></div>

<div class="portal-card">
  <button type="button" class="portal-dismiss" id="portalDismiss" aria-label="Close sign-in">&times;</button>
  <div class="portal-lockup">
    <p class="portal-wordmark"><b>FABUS</b><span>PORTAL</span><i></i></p>
    <h1 class="portal-heading">Sourcing getting simpler.</h1>
  </div>

  <div class="portal-error" id="portalError">The email you entered isn't registered yet. New here? <a href="portal-signup.html">Sign up</a> to get started.</div>

  <form id="portalLoginForm">
    <div class="portal-field">
      <label class="portal-label" for="portalEmail">Email Address</label>
      <input type="email" id="portalEmail" class="portal-input" placeholder="you@company.com" required>
    </div>
    <div class="portal-field">
      <label class="portal-label" for="portalPassword">Password</label>
      <input type="password" id="portalPassword" class="portal-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
    </div>
    <div class="portal-row-between">
      <label class="portal-remember"><input type="checkbox"> Remember me</label>
      <a href="#" class="portal-forgot" id="portalForgotLink">Forgot password?</a>
    </div>
    <button type="submit" class="portal-submit">Sign In</button>
  </form>

  <p class="portal-footer-note">Don't have access yet? <a href="portal-signup.html">Sign Up</a></p>

  <!-- Forgot-password panel: hidden until "Forgot password?" is clicked,
       swaps in for the sign-in form itself (same card, no separate page) -->
  <div id="portalForgotPanel" style="display:none;">
    <div class="portal-error" id="portalForgotError"></div>
    <form id="portalForgotForm">
      <div class="portal-field">
        <label class="portal-label" for="portalForgotEmail">Email Address</label>
        <input type="email" id="portalForgotEmail" class="portal-input" placeholder="you@company.com">
      </div>
      <button type="submit" class="portal-submit">Send Reset Link</button>
    </form>
    <p class="portal-footer-note"><a href="#" id="portalForgotBack">&larr; Back to Sign In</a></p>
  </div>
</div>

<script>
  document.getElementById('portalLoginForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('portalError').style.display = 'block';
  });

  document.getElementById('portalDismiss').addEventListener('click', function(){
    if(window.history.length > 1){ window.history.back(); }
    else { window.location.href = 'index.html'; }
  });

  // Forgot-password flow: swap the sign-in form for the reset panel,
  // in the same card, rather than linking to a separate (nonexistent) page.
  var loginForm = document.getElementById('portalLoginForm');
  var loginError = document.getElementById('portalError');
  var loginFooterNote = document.querySelector('.portal-card > .portal-footer-note');
  var forgotPanel = document.getElementById('portalForgotPanel');
  var forgotError = document.getElementById('portalForgotError');
  var forgotForm = document.getElementById('portalForgotForm');
  var forgotEmail = document.getElementById('portalForgotEmail');

  function showForgotPanel(){
    loginForm.style.display = 'none';
    loginError.style.display = 'none';
    if (loginFooterNote) loginFooterNote.style.display = 'none';
    forgotError.style.display = 'none';
    forgotEmail.value = '';
    forgotPanel.style.display = 'block';
  }
  function showLoginForm(){
    forgotPanel.style.display = 'none';
    loginForm.style.display = '';
    if (loginFooterNote) loginFooterNote.style.display = '';
  }

  document.getElementById('portalForgotLink').addEventListener('click', function(e){
    e.preventDefault();
    showForgotPanel();
  });
  document.getElementById('portalForgotBack').addEventListener('click', function(e){
    e.preventDefault();
    showLoginForm();
  });

  forgotForm.addEventListener('submit', function(e){
    e.preventDefault();
    var email = forgotEmail.value.trim();
    if (!email){
      forgotError.innerHTML = 'Please enter your email to continue.';
    } else {
      forgotError.innerHTML = 'The email you entered isn\'t registered yet. New here? <a href="portal-signup.html">Sign up</a> to get started.';
    }
    forgotError.style.display = 'block';
  });
</script>

</body>
</html>
